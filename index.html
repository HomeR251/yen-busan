const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.replace(/\s+/g,'').toUpperCase()),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.d)));
  try{localStorage.setItem('yen-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}

});
(async()=>{let s=null;try{s=localStorage.getItem('yen-pw')}catch(e){}if(s){try{await open(s)}catch(e){try{localStorage.removeItem('yen-pw')}catch(_){}}}})();
