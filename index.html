async function open(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.replace(/\s+/g,'').toUpperCase()),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);

  document.open();document.write(html);document.close();
}
