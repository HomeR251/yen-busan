  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.d)));
  try{localStorage.setItem('yen-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const err=document.getElementById('err');err.textContent='解鎖中…';
  try{await open(document.getElementById('pw').value)}catch(x){err.textContent='密碼不對，再試一次'}
});
(async()=>{let s=null;try{s=localStorage.getItem('yen-pw')}catch(e){}if(s){try{await open(s)}catch(e){try{localStorage.removeItem('yen-pw')}catch(_){}}}})();
</script>
